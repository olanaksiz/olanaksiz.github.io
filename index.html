<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Çinden Kargo — 7 Günde Teslimat</title>
<meta name="description" content="Çinden Kargo — 7 günde teslimat.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,500;1,600;1,800&display=swap" rel="stylesheet">
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:48px;
       padding:32px 20px;font-family:'Barlow Condensed',system-ui,sans-serif;background:#fff;color:#0B2A5B;text-align:center}
  .logo{display:flex;align-items:center;justify-content:center;gap:clamp(16px,4vw,34px);flex-wrap:wrap}
  .logo svg{width:clamp(120px,24vw,182px);height:auto}
  .word{font-style:italic;font-weight:800;font-size:clamp(44px,11vw,84px);line-height:1;letter-spacing:1px;margin:0;white-space:nowrap}
  .word span{color:#F04E23}
  .slogan{display:flex;align-items:center;gap:8px;margin-top:12px}
  .slogan i{display:block;height:5px;background:#F04E23;transform:skewX(-20deg)}
  .slogan i:nth-child(1){width:12px}.slogan i:nth-child(2){width:30px}.slogan i:nth-child(3){flex:1;min-width:20px}
  .slogan b{font-style:italic;font-weight:600;font-size:clamp(16px,3.6vw,24px);letter-spacing:3px;margin-left:6px;white-space:nowrap}
  .soon{font-size:22px;font-weight:500;color:#4A5568;margin:0;letter-spacing:.5px}
</style>
</head>
<body>
  <main class="logo">
    <svg viewBox="0 0 140 100" role="img" aria-label="Çinden Kargo amblemi">
      <polygon points="78,10 100,10 132,50 100,90 78,90 110,50" fill="#0B2A5B"/>
      <polygon points="34,18 74.4,18 84,30 43.6,30" fill="#F04E23"/>
      <polygon points="8,44 95.2,44 100,50 95.2,56 8,56" fill="#F04E23"/>
      <polygon points="43.6,70 84,70 74.4,82 34,82" fill="#F04E23"/>
    </svg>
    <div>
      <h1 class="word">ÇİNDEN <span>KARGO</span></h1>
      <div class="slogan"><i></i><i></i><i></i><b>7 GÜNDE TESLİMAT</b></div>
    </div>
  </main>
  <p class="soon">Sitemiz çok yakında yayında.</p>
</body>
</html>
